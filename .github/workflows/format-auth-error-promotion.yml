name: Format auth error promotion

on:
  push:
    branches:
      - feat/5-github-auth-profile
    paths:
      - .github/workflows/format-auth-error-promotion.yml

permissions:
  contents: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0

jobs:
  format:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feat/5-github-auth-profile

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pinned formatter
        run: pnpm exec prettier --write apps/web/src/app/auth/error/page.tsx

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/auth/error/page.tsx
          git commit -m 'style: apply pinned Prettier to auth error page'
          git push origin HEAD:feat/5-github-auth-profile
