name: Bootstrap issue 5 dependency lockfile

on:
  push:
    branches:
      - feat/5-github-auth-profile
    paths:
      - .github/workflows/bootstrap-auth-lockfile.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-issue-5-lockfile
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the active issue branch
        uses: actions/checkout@v7
        with:
          ref: feat/5-github-auth-profile

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Refresh the committed dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Verify the auth dependencies are locked
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '@supabase/ssr' pnpm-lock.yaml
          grep -Fq '@supabase/supabase-js' pnpm-lock.yaml
          grep -Fq '19.2.8' pnpm-lock.yaml

      - name: Commit the lockfile and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-auth-lockfile.yml
          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo 'No lockfile change was needed.'
            exit 0
          fi

          git commit -m 'chore: refresh issue #5 dependency lockfile'
          git push origin HEAD:feat/5-github-auth-profile
