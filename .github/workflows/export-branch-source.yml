name: Export Project branch source

on:
  push:
    branches:
      - feat/7-project-formation
    paths:
      - .github/workflows/export-branch-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact branch commit
        uses: actions/checkout@v7

      - name: Remove Git metadata and generated caches
        run: rm -rf .git node_modules .next apps/web/.next test-results playwright-report

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: manyhands-project-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
