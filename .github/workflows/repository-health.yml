name: Repository health

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            LICENSE
            NOTICE
            CONTRIBUTING.md
            GOVERNANCE.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            AGENTS.md
            AI_agent.md
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig.base.json
            docs/CONSTITUTION.md
            docs/PRODUCT.md
            docs/DOMAIN_MODEL.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/AI_CONTRIBUTIONS.md
            docs/BRANCHING.md
            docs/agent-status/README.md
            docs/agent-status/issue-5.md
            docs/DEVELOPMENT.md
            docs/DATABASE.md
            docs/DATA_LIFECYCLE.md
            docs/decisions/0003-stable-identity-and-public-read-models.md
            scripts/validate-agent-context.mjs
            scripts/validate-branch-name.mjs
            packages/domain/package.json
            packages/domain/tsconfig.json
            packages/domain/src/index.ts
            packages/domain/src/authorization.ts
            packages/data/package.json
            packages/data/tsconfig.json
            packages/data/src/index.ts
            packages/data/src/database.types.ts
            apps/web/package.json
            apps/web/src/app/layout.tsx
            apps/web/src/app/page.tsx
            tests/unit/authorization-policy.test.ts
            tests/e2e/home.spec.ts
            supabase/config.toml
            supabase/seed.sql
            supabase/migrations/20260827021954_establish_identity_foundation.sql
            supabase/tests/database/000_identity_schema.test.sql
            supabase/tests/database/010_profile_rls.test.sql
            supabase/tests/database/020_account_lifecycle.test.sql
            .github/CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            .github/repository-taxonomy.json
            .github/workflows/application-ci.yml
            .github/workflows/branch-policy.yml
            .github/workflows/database-ci.yml
            .github/workflows/delete-merged-branch.yml
            .github/workflows/sync-repository-taxonomy.yml
          )

          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Required file is missing or empty: $path" >&2
              exit 1
            fi
          done

      - name: Verify runtime and package-manager pins
        shell: bash
        run: |
          set -euo pipefail

          node_pin="$(tr -d '[:space:]' < .nvmrc)"
          node_version_file="$(tr -d '[:space:]' < .node-version)"

          if [[ "$node_pin" != "$node_version_file" ]]; then
            echo ".nvmrc and .node-version disagree" >&2
            exit 1
          fi

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          package_manager = package.get("packageManager", "")
          if not package_manager.startswith("pnpm@"):
              raise SystemExit("package.json must pin pnpm through packageManager")

          engine = package.get("engines", {}).get("node", "")
          node_pin = Path(".nvmrc").read_text(encoding="utf-8").strip()
          if node_pin not in engine:
              raise SystemExit("the Node engine range must include the pinned Node version")

          supabase_version = package.get("devDependencies", {}).get("supabase", "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", supabase_version):
              raise SystemExit("the Supabase CLI must be pinned to an exact semantic version")
          PY

          grep -Fq "supabase: true" pnpm-workspace.yaml
          grep -Fq 'major_version = 17' supabase/config.toml

      - name: Verify licensing declaration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -Fq "Version 3, 19 November 2007" LICENSE
          grep -Fq "SPDX-License-Identifier: AGPL-3.0-or-later" NOTICE
          grep -Fq "GNU AGPL v3 or later" README.md

      - name: Reject tracked secrets and generated debris
        shell: bash
        run: |
          set -euo pipefail

          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Environment files must not be committed:" >&2
            echo "$tracked_env_files" >&2
            exit 1
          fi

          tracked_debris="$(git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db)$|(^|/)\.supabase/' || true)"
          if [[ -n "$tracked_debris" ]]; then
            echo "Generated or operating-system debris is tracked:" >&2
            echo "$tracked_debris" >&2
            exit 1
          fi

          if grep -Eiq '(service[_-]?role|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password[[:space:]]*=|sk-[A-Za-z0-9_-]{12,})' supabase/seed.sql; then
            echo "The database seed appears to contain a secret-like value" >&2
            exit 1
          fi

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"

          files = Dir[".github/**/*.{yml,yaml}"]
          abort "No YAML files found" if files.empty?

          files.each do |file|
            YAML.safe_load(File.read(file), permitted_classes: [], aliases: true)
            puts "valid: #{file}"
          end
          RUBY

      - name: Validate agent context and branch automation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-agent-context.mjs
          grep -Fq "github.event.pull_request.head.repo.full_name == github.repository" .github/workflows/branch-policy.yml
          grep -Fq "contents: write" .github/workflows/delete-merged-branch.yml
          grep -Fq "github.event.pull_request.merged == true" .github/workflows/delete-merged-branch.yml

      - name: Validate repository taxonomy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path(".github/repository-taxonomy.json")
          taxonomy = json.loads(path.read_text(encoding="utf-8"))

          labels = taxonomy.get("labels")
          milestones = taxonomy.get("milestones")
          issues = taxonomy.get("issues")
          if not isinstance(labels, list) or not labels:
              raise SystemExit("taxonomy.labels must be a non-empty list")
          if not isinstance(milestones, list) or not milestones:
              raise SystemExit("taxonomy.milestones must be a non-empty list")
          if not isinstance(issues, dict) or not issues:
              raise SystemExit("taxonomy.issues must be a non-empty object")

          label_names = [item.get("name") for item in labels]
          if None in label_names or len(label_names) != len(set(label_names)):
              raise SystemExit("custom label names must be present and unique")
          for label in labels:
              if not re.fullmatch(r"[0-9a-fA-F]{6}", label.get("color", "")):
                  raise SystemExit(f"invalid six-digit label color: {label!r}")
              if not label.get("description"):
                  raise SystemExit(f"label description is required: {label['name']}")

          milestone_titles = [item.get("title") for item in milestones]
          if None in milestone_titles or len(milestone_titles) != len(set(milestone_titles)):
              raise SystemExit("milestone titles must be present and unique")
          if any(not item.get("description") for item in milestones):
              raise SystemExit("every milestone requires a description")

          github_defaults = {
              "bug",
              "documentation",
              "duplicate",
              "enhancement",
              "good first issue",
              "help wanted",
              "invalid",
              "question",
              "wontfix",
          }
          allowed_labels = set(label_names) | github_defaults
          allowed_milestones = set(milestone_titles)

          for issue_number, assignment in issues.items():
              if not issue_number.isdigit() or int(issue_number) < 1:
                  raise SystemExit(f"invalid issue number: {issue_number!r}")
              assigned_labels = assignment.get("labels")
              if not isinstance(assigned_labels, list) or not assigned_labels:
                  raise SystemExit(f"issue #{issue_number} requires at least one label")
              unknown_labels = sorted(set(assigned_labels) - allowed_labels)
              if unknown_labels:
                  raise SystemExit(
                      f"issue #{issue_number} references unknown labels: {unknown_labels}"
                  )
              if "ready" in assigned_labels and "blocked" in assigned_labels:
                  raise SystemExit(f"issue #{issue_number} cannot be both ready and blocked")
              milestone = assignment.get("milestone")
              if milestone not in allowed_milestones:
                  raise SystemExit(
                      f"issue #{issue_number} references unknown milestone: {milestone!r}"
                  )

          print(
              f"valid taxonomy: {len(labels)} custom labels, "
              f"{len(milestones)} milestones, {len(issues)} issue assignments"
          )
          PY

      - name: Verify database foundation invariants
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          if [[ ${#migrations[@]} -lt 1 ]]; then
            echo "At least one database migration is required" >&2
            exit 1
          fi

          for migration in "${migrations[@]}"; do
            filename="$(basename "$migration")"
            if [[ ! "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Migration filename is not CLI-shaped: $filename" >&2
              exit 1
            fi
            if [[ ! -s "$migration" ]]; then
              echo "Migration is empty: $migration" >&2
              exit 1
            fi
          done

          migration="supabase/migrations/20260827021954_establish_identity_foundation.sql"
          grep -Fq "create schema private" "$migration"
          grep -Fq "enable row level security" "$migration"
          grep -Fq "force row level security" "$migration"
          grep -Fq "security_invoker = true" "$migration"
          grep -Fq "set search_path = ''" "$migration"
          grep -Fq "revoke all on table private.accounts from authenticated" "$migration"
          grep -Fq "manyhands_anonymize_account_before_auth_user_delete" "$migration"

          if grep -Fq "auth.role()" "$migration"; then
            echo "Database policy must not rely on auth.role()" >&2
            exit 1
          fi

          grep -Fq 'capability: "profile.update"' tests/unit/authorization-policy.test.ts
          grep -Fq 'capability: "project.update"' tests/unit/authorization-policy.test.ts
          grep -Fq 'capability: "moderation.report.read_private"' tests/unit/authorization-policy.test.ts
          grep -Fq "supabase test db" .github/workflows/database-ci.yml
          grep -Fq "supabase db lint" .github/workflows/database-ci.yml
          grep -Fq "diff -u packages/data/src/database.types.ts" .github/workflows/database-ci.yml
          grep -Fq "security_invoker" supabase/tests/database/000_identity_schema.test.sql
          grep -Fq "suspension prevents protected writes" supabase/tests/database/010_profile_rls.test.sql
          grep -Fq "optional profile data is scrubbed" supabase/tests/database/020_account_lifecycle.test.sql

      - name: Check whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ -n "${BASE_SHA:-}" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
