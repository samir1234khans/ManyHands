name: Bootstrap operations formatting

on:
  push:
    branches:
      - feat/16-operations-foundation
    paths:
      - .github/workflows/bootstrap-operations-format.yml

permissions:
  contents: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  normalize-and-verify:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out operations work
        uses: actions/checkout@v7
        with:
          ref: feat/16-operations-foundation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize and verify source
        run: |
          set -euo pipefail
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit formatting and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-operations-format.yml
          git add apps tests docs .github
          git diff --cached --check
          git commit -m 'chore: normalize the operations foundation'
          git push origin HEAD:feat/16-operations-foundation
