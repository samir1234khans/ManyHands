name: Bootstrap Problem directory

on:
  push:
    branches:
      - feat/6-problem-directory-foundation
    paths:
      - .github/workflows/bootstrap-problem-directory.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-problem-directory
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  SUPABASE_TELEMETRY_DISABLED: 1

jobs:
  normalize-and-verify:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the Problem branch
        uses: actions/checkout@v7
        with:
          ref: feat/6-problem-directory-foundation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the isolated local database
        run: pnpm exec supabase db start

      - name: Rebuild from immutable migrations and safe seed
        run: pnpm exec supabase db reset

      - name: Run Problem database, RLS, and lifecycle tests
        run: pnpm exec supabase test db

      - name: Lint public and private database functions
        run: >-
          pnpm exec supabase db lint
          --local
          --schema public,private
          --level warning
          --fail-on warning

      - name: Generate committed database types
        shell: bash
        run: |
          set -euo pipefail
          generated="packages/data/src/database.types.ts"
          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            rm -f "$generated"
            echo "Generating database types (attempt ${attempt}/${max_attempts})..."

            if pnpm exec supabase gen types typescript \
              --local \
              --schema public,private \
              > "$generated"; then
              break
            fi

            rm -f "$generated"

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Database type generation failed after ${max_attempts} attempts." >&2
              exit 1
            fi

            delay=$((15 * (2 ** (attempt - 1))))
            echo "::warning::Type generation failed; retrying in ${delay}s."
            sleep "$delay"
          done

          test -s "$generated"
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/data/src/database.types.ts")
          path.write_bytes(path.read_bytes().rstrip(b"\n") + b"\n")
          PY

      - name: Apply the pinned formatter
        run: pnpm format

      - name: Verify generated and formatted source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'problem_directory' packages/data/src/database.types.ts
          grep -Fq 'toggle_problem_need_signal' packages/data/src/database.types.ts
          grep -Fq 'problem.interact' packages/domain/src/authorization.ts
          test -s apps/web/src/app/problems/page.tsx
          test -s tests/e2e/problems.spec.ts
          test -s docs/PROBLEMS.md

      - name: Commit generated and normalized Problem work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages tests supabase docs .github

          if git diff --cached --quiet; then
            echo 'No generated or formatter changes were required.'
            exit 0
          fi

          git commit -m 'feat: complete the Problem directory checkpoint'
          git push origin HEAD:feat/6-problem-directory-foundation

      - name: Stop and delete the isolated database
        if: always()
        run: pnpm exec supabase stop --no-backup
