name: One-time stale branch cleanup

on:
  push:
    branches:
      - chore/34-branch-governance
    paths:
      - .github/workflows/one-time-stale-branch-cleanup.yml

permissions:
  contents: write

concurrency:
  group: one-time-stale-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the governance branch
        uses: actions/checkout@v7
        with:
          ref: chore/34-branch-governance

      - name: Delete branches verified as merged, superseded, or stale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          branches = [
              "chore/advance-roadmap-after-3",
              "chore/advance-roadmap-after-4",
              "chore/foundation-hardening",
              "chore/repo-foundation",
              "chore/repository-taxonomy",
              "chore/18-repository-metadata",
              "docs/foundation-status",
              "docs/18-repository-settings",
              "feat/3-bootstrap-application",
              "feat/4-data-foundation",
              "fix/canonical-agpl-license",
          ]

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "ManyHands-one-time-branch-audit",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for branch in branches:
              if branch in {"main", "feat/5-github-auth-profile", "chore/34-branch-governance"}:
                  raise RuntimeError(f"protected cleanup exclusion violated: {branch}")

              encoded = urllib.parse.quote(branch, safe="")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/refs/heads/{encoded}",
                  method="DELETE",
                  headers=headers,
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise RuntimeError(
                              f"unexpected status deleting {branch}: {response.status}"
                          )
                  print(f"deleted: {branch}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"already absent: {branch}")
                  else:
                      body = error.read().decode("utf-8", errors="replace")
                      raise RuntimeError(
                          f"failed deleting {branch} with {error.code}: {body}"
                      ) from error
          PY

      - name: Remove the one-time workflow from the governance branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-stale-branch-cleanup.yml
          git commit -m 'chore: finish the audited stale-branch cleanup'
          git push origin HEAD:chore/34-branch-governance
