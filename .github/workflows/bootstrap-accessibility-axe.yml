name: Bootstrap accessibility axe hardening

on:
  push:
    branches:
      - test/14-accessibility-automation-hardening
    paths:
      - .github/workflows/bootstrap-accessibility-axe.yml

permissions:
  contents: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify-and-lock:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out accessibility work
        uses: actions/checkout@v7
        with:
          ref: test/14-accessibility-automation-hardening
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh the lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Normalize and verify application source
        run: |
          set -euo pipefail
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm exec playwright install chromium
          pnpm test:e2e

      - name: Commit lockfile and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-accessibility-axe.yml
          git add package.json pnpm-lock.yaml tests docs .github
          git diff --cached --check
          git commit -m 'test: finalize accessibility automation hardening'
          git push origin HEAD:test/14-accessibility-automation-hardening
