name: Bootstrap issue 4 Supabase workspace

on:
  push:
    branches:
      - feat/4-data-foundation
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/bootstrap-issue-4.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-issue-4
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  SUPABASE_TELEMETRY_DISABLED: 1

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: feat/4-data-foundation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Discover the current Supabase CLI contract
        run: |
          set -euo pipefail
          pnpm exec supabase --version
          pnpm exec supabase --help
          pnpm exec supabase init --help
          pnpm exec supabase migration new --help

      - name: Generate project configuration and migration identity
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            pnpm exec supabase init
          fi
          if ! find supabase/migrations -maxdepth 1 -type f -name '*_establish_identity_foundation.sql' -print -quit | grep -q .; then
            pnpm exec supabase migration new establish_identity_foundation
          fi

      - name: Commit generated foundations and retire this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-issue-4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml supabase .github/workflows/bootstrap-issue-4.yml
          git commit -m 'chore: bootstrap the Supabase data workspace'
          git push origin HEAD:feat/4-data-foundation
