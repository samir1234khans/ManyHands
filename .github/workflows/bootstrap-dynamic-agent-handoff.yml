name: Bootstrap dynamic agent handoff validation

on:
  push:
    branches:
      - chore/34-branch-governance
    paths:
      - .github/workflows/bootstrap-dynamic-agent-handoff.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-dynamic-agent-handoff
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the governance branch
        uses: actions/checkout@v7
        with:
          ref: chore/34-branch-governance

      - name: Remove the issue-specific hard-coded requirement
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*docs\/agent-status\/issue-5\.md[[:space:]]*$/d' \
            .github/workflows/repository-health.yml

          if grep -Fq 'docs/agent-status/issue-5.md' .github/workflows/repository-health.yml; then
            echo 'issue-specific handoff is still hard-coded' >&2
            exit 1
          fi

          grep -Fq 'node scripts/validate-agent-context.mjs' .github/workflows/repository-health.yml

      - name: Commit the normalized workflow and remove this one-time helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-dynamic-agent-handoff.yml
          git add .github/workflows/repository-health.yml
          git commit -m 'fix: discover the active agent handoff dynamically'
          git push origin HEAD:chore/34-branch-governance
