name: Format Project contract checkpoint

on:
  push:
    branches:
      - design/7-project-formation-contract
    paths:
      - .github/workflows/format-project-contract.yml

permissions:
  contents: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0

jobs:
  format:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the Project contract branch
        uses: actions/checkout@v7
        with:
          ref: design/7-project-formation-contract
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the pinned formatter
        run: pnpm format

      - name: Commit formatted source and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-project-contract.yml
          git add packages tests docs .github
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'Expected formatter or helper-cleanup changes were not produced.' >&2
            exit 1
          fi

          git commit -m 'style: apply the pinned formatter to the Project contract'
          git push origin HEAD:design/7-project-formation-contract
