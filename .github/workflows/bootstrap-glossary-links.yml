name: Bootstrap glossary cross-links

on:
  push:
    branches:
      - docs/20-domain-glossary
    paths:
      - .github/workflows/bootstrap-glossary-links.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-glossary-links
  cancel-in-progress: false

jobs:
  link-glossary:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the glossary branch
        uses: actions/checkout@v7
        with:
          ref: docs/20-domain-glossary

      - name: Add the glossary to repository entry points
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              "- [`docs/README.md`](docs/README.md) for role-based reading paths and the authority of each document;\n- [`docs/DEVELOPMENT.md`](docs/DEVELOPMENT.md)",
              "- [`docs/README.md`](docs/README.md) for role-based reading paths and the authority of each document;\n- [`docs/GLOSSARY.md`](docs/GLOSSARY.md) for plain-language product terms, distinctions, and one complete example;\n- [`docs/DEVELOPMENT.md`](docs/DEVELOPMENT.md)",
          )
          replace_once(
              "README.md",
              "- [`docs/README.md`](docs/README.md)\n- [`CONTRIBUTING.md`](CONTRIBUTING.md)",
              "- [`docs/README.md`](docs/README.md)\n- [`docs/GLOSSARY.md`](docs/GLOSSARY.md)\n- [`CONTRIBUTING.md`](CONTRIBUTING.md)",
          )

          replace_once(
              "CONTRIBUTING.md",
              "1. Read [`AGENTS.md`](AGENTS.md) for the verified operational status, then use [`docs/README.md`](docs/README.md) to choose the product, engineering, design, security, community, or operations reading path relevant to your work.",
              "1. Read [`AGENTS.md`](AGENTS.md) for the verified operational status, then use [`docs/README.md`](docs/README.md) to choose the reading path relevant to your work. Use [`docs/GLOSSARY.md`](docs/GLOSSARY.md) when a ManyHands product term or distinction is unfamiliar.",
          )
          replace_once(
              "CONTRIBUTING.md",
              "See [the domain model](docs/DOMAIN_MODEL.md) for authoritative definitions and the [documentation map](docs/README.md) for the plain-language and role-specific reading paths.",
              "See the [plain-language glossary](docs/GLOSSARY.md) for examples and common distinctions, the [domain model](docs/DOMAIN_MODEL.md) for authoritative definitions and invariants, and the [documentation map](docs/README.md) for role-specific reading paths.",
          )

          replace_once(
              "docs/DOMAIN_MODEL.md",
              "This document defines product language and invariants before database tables are designed. Storage can change; these meanings should not drift accidentally.\n",
              "This document defines product language and invariants before database tables are designed. Storage can change; these meanings should not drift accidentally.\n\nFor an everyday-language explanation and a complete worked example, read [`GLOSSARY.md`](GLOSSARY.md). This domain model remains authoritative when wording differs.\n",
          )

          replace_once(
              "docs/README.md",
              "4. [`PRODUCT.md`](PRODUCT.md) — users, v0 scope, explicit non-goals, critical flows, and the self-hosting acceptance test.\n5. [`../CONTRIBUTING.md`](../CONTRIBUTING.md)",
              "4. [`PRODUCT.md`](PRODUCT.md) — users, v0 scope, explicit non-goals, critical flows, and the self-hosting acceptance test.\n5. [`GLOSSARY.md`](GLOSSARY.md) — plain-language product terms, important distinctions, and a complete Problem-to-Evidence example.\n6. [`../CONTRIBUTING.md`](../CONTRIBUTING.md)",
          )
          replace_once(
              "docs/README.md",
              "6. [`ROADMAP.md`](ROADMAP.md) and the [public roadmap issue]",
              "7. [`ROADMAP.md`](ROADMAP.md) and the [public roadmap issue]",
          )
          replace_once(
              "docs/README.md",
              "7. [`BRANCHING.md`](BRANCHING.md) — issue-linked branch naming",
              "8. [`BRANCHING.md`](BRANCHING.md) — issue-linked branch naming",
          )
          replace_once(
              "docs/README.md",
              "- [`ARCHITECTURE.md`](ARCHITECTURE.md) — system boundaries",
              "- [`GLOSSARY.md`](GLOSSARY.md) — a plain-language reading aid; `DOMAIN_MODEL.md` remains authoritative.\n- [`ARCHITECTURE.md`](ARCHITECTURE.md) — system boundaries",
          )
          replace_once(
              "docs/README.md",
              "3. [`DOMAIN_MODEL.md`](DOMAIN_MODEL.md)\n4. [`ROADMAP.md`](ROADMAP.md)",
              "3. [`GLOSSARY.md`](GLOSSARY.md)\n4. [`DOMAIN_MODEL.md`](DOMAIN_MODEL.md)\n5. [`ROADMAP.md`](ROADMAP.md)",
          )
          replace_once(
              "docs/README.md",
              "5. [`ARCHITECTURE.md`](ARCHITECTURE.md), especially public/private data and accessibility constraints\n6. The product-design",
              "6. [`ARCHITECTURE.md`](ARCHITECTURE.md), especially public/private data and accessibility constraints\n7. The product-design",
          )
          PY

      - name: Commit cross-links and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-glossary-links.yml
          git add README.md CONTRIBUTING.md docs/README.md docs/DOMAIN_MODEL.md
          git commit -m 'docs: link the glossary from repository entry points'
          git push origin HEAD:docs/20-domain-glossary
