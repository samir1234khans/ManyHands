name: Bootstrap identity user interface

on:
  push:
    branches:
      - feat/5-github-auth-profile
    paths:
      - .github/workflows/bootstrap-identity-ui.yml

permissions:
  contents: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0

jobs:
  normalize:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the identity branch
        uses: actions/checkout@v7
        with:
          ref: feat/5-github-auth-profile

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate identity navigation, safe deletion, and styles
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          page = Path("apps/web/src/app/page.tsx")
          text = page.read_text(encoding="utf-8")
          text = text.replace(
              'import { siteConfig } from "@/lib/site-config";\n',
              'import { SiteFooter } from "@/components/site-footer";\nimport { SiteHeader } from "@/components/site-header";\nimport { siteConfig } from "@/lib/site-config";\n',
              1,
          )
          header_start = text.index('      <header className="site-header">')
          header_end = text.index('      <main id="main-content">', header_start)
          text = text[:header_start] + '      <SiteHeader />\n\n' + text[header_end:]
          text = text.replace('<main id="main-content">', '<main id="main-content" tabIndex={-1}>', 1)
          footer_start = text.index('      <footer className="site-footer">')
          footer_end = text.index('    </>\n  );', footer_start)
          text = text[:footer_start] + '      <SiteFooter />\n' + text[footer_end:]
          page.write_text(text, encoding="utf-8")

          replace_once(
              "apps/web/src/app/settings/actions.ts",
              'import { createSignInPath } from "@/lib/auth/return-path";\nimport { createAdminSupabaseClient } from "@/lib/supabase/admin";',
              'import { createSignInPath } from "@/lib/auth/return-path";\nimport { getServerSupabaseSecret } from "@/lib/env";\nimport { createAdminSupabaseClient } from "@/lib/supabase/admin";',
          )
          replace_once(
              "apps/web/src/app/settings/actions.ts",
              '  const { error: requestError } = await context.supabase.rpc("request_account_deletion");',
              '  if (!getServerSupabaseSecret()) {\n    settingsError("administration_unavailable");\n  }\n\n  const { error: requestError } = await context.supabase.rpc("request_account_deletion");',
          )
          replace_once(
              "apps/web/src/app/settings/page.tsx",
              'const errorMessages: Record<string, string> = {\n  account_inactive:',
              'const errorMessages: Record<string, string> = {\n  administration_unavailable:\n    "Account administration is not configured in this environment. No deletion request was started.",\n  account_inactive:',
          )

          replace_once(
              "tests/e2e/identity.spec.ts",
              'await expect(page.getByRole("heading", { level: 1, name: "This path is still unclaimed." })).toBeVisible();',
              'await expect(page.getByRole("heading", { level: 1, name: "That page wandered off." })).toBeVisible();',
          )

          css_path = Path("apps/web/src/app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          if ".identity-page {" in css:
              raise SystemExit("identity styles already exist")
          css += '''\n\n.primary-nav form {\n  margin: 0;\n}\n\n.nav-action,\n.nav-action-link {\n  padding: 0.5rem 0.72rem;\n  border: 1px solid var(--line);\n  border-radius: 0.65rem;\n  background: var(--surface);\n  color: var(--ink);\n  font: inherit;\n  font-weight: 750;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.nav-action:hover,\n.nav-action-link:hover {\n  border-color: var(--accent);\n  background: var(--surface-soft);\n}\n\n.identity-page,\n.directory-page,\n.profile-page,\n.profile-editor-page,\n.settings-page {\n  padding-block: clamp(4rem, 10vw, 7rem);\n}\n\n.identity-card,\n.state-card,\n.empty-state,\n.settings-card,\n.profile-form,\n.public-profile {\n  border: 1px solid var(--line);\n  border-radius: var(--radius-large);\n  background: var(--surface);\n  box-shadow: var(--shadow);\n}\n\n.identity-card,\n.state-card,\n.empty-state {\n  max-width: 52rem;\n  margin-inline: auto;\n  padding: clamp(1.6rem, 5vw, 3.4rem);\n}\n\n.identity-card h1,\n.content-hero h1,\n.public-profile h1 {\n  margin: 0;\n  font-size: clamp(2.7rem, 7vw, 5rem);\n  letter-spacing: -0.065em;\n  line-height: 0.98;\n}\n\n.identity-lead,\n.content-lead {\n  color: var(--muted);\n  font-size: clamp(1.05rem, 2vw, 1.25rem);\n}\n\n.identity-explainer {\n  margin-top: 2rem;\n  padding-top: 1.5rem;\n  border-top: 1px solid var(--line);\n}\n\n.identity-explainer h2,\n.public-profile h2,\n.settings-card h2 {\n  margin-top: 0;\n  letter-spacing: -0.035em;\n}\n\n.identity-actions,\n.form-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 0.85rem;\n  align-items: center;\n  margin-top: 2rem;\n}\n\n.notice,\n.form-summary {\n  margin-block: 1.4rem;\n  padding: 1rem 1.1rem;\n  border: 1px solid var(--line);\n  border-radius: 0.8rem;\n  background: var(--surface-soft);\n}\n\n.notice p,\n.form-summary p {\n  margin: 0;\n}\n\n.notice p + p {\n  margin-top: 0.55rem;\n}\n\n.notice-success,\n.form-summary-success {\n  border-color: var(--accent);\n}\n\n.notice-warning,\n.form-summary-error {\n  border-color: #a94c32;\n}\n\n.content-hero {\n  max-width: 54rem;\n  margin-bottom: clamp(3rem, 7vw, 5rem);\n}\n\n.directory-page,\n.profile-editor-page,\n.settings-page {\n  display: grid;\n  gap: clamp(2rem, 5vw, 4rem);\n}\n\n.profile-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));\n  gap: 1rem;\n}\n\n.profile-card {\n  display: grid;\n  align-content: start;\n  gap: 1rem;\n  padding: 1.4rem;\n  border: 1px solid var(--line);\n  border-radius: var(--radius-medium);\n  background: var(--surface);\n}\n\n.profile-card-heading {\n  display: flex;\n  gap: 0.9rem;\n  align-items: center;\n}\n\n.profile-avatar {\n  display: grid;\n  width: 3rem;\n  height: 3rem;\n  flex: 0 0 auto;\n  place-items: center;\n  border-radius: 50%;\n  background: var(--accent-soft);\n  color: var(--accent-strong);\n  font-weight: 900;\n}\n\n.profile-card h2,\n.profile-card p {\n  margin: 0;\n}\n\n.profile-card h2 {\n  font-size: 1.25rem;\n}\n\n.profile-card h2 a {\n  text-decoration: none;\n}\n\n.profile-handle,\n.profile-biography,\n.field-help,\n.privacy-note {\n  color: var(--muted);\n}\n\n.availability {\n  width: fit-content;\n  margin: 0;\n  padding: 0.3rem 0.6rem;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  font-size: 0.78rem;\n  font-weight: 800;\n}\n\n.availability-open {\n  border-color: var(--accent);\n  color: var(--accent-strong);\n}\n\n.profile-tags,\n.public-link-list,\n.plain-list {\n  margin: 0;\n}\n\n.profile-tags {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 0.45rem;\n  padding: 0;\n  list-style: none;\n}\n\n.profile-tags li {\n  padding: 0.35rem 0.6rem;\n  border-radius: 999px;\n  background: var(--surface-soft);\n  color: var(--muted);\n  font-size: 0.8rem;\n  font-weight: 750;\n}\n\n.public-profile {\n  display: grid;\n  gap: 2.2rem;\n  max-width: 52rem;\n  margin-inline: auto;\n  padding: clamp(1.6rem, 5vw, 3.4rem);\n}\n\n.public-profile section {\n  padding-top: 1.5rem;\n  border-top: 1px solid var(--line);\n}\n\n.public-profile section p {\n  color: var(--muted);\n}\n\n.profile-facts dl {\n  display: grid;\n  gap: 0.75rem;\n}\n\n.profile-facts dl div {\n  display: grid;\n  grid-template-columns: minmax(7rem, 0.35fr) 1fr;\n  gap: 1rem;\n}\n\n.profile-facts dt {\n  font-weight: 800;\n}\n\n.profile-facts dd {\n  margin: 0;\n  color: var(--muted);\n}\n\n.public-link-list {\n  display: grid;\n  gap: 0.65rem;\n  padding: 0;\n  list-style: none;\n}\n\n.public-link-list a {\n  display: inline-flex;\n  gap: 0.45rem;\n  font-weight: 800;\n}\n\n.profile-form {\n  display: grid;\n  gap: 1.4rem;\n  padding: clamp(1.4rem, 4vw, 2.5rem);\n}\n\n.form-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 1rem;\n}\n\n.form-field {\n  display: grid;\n  gap: 0.45rem;\n}\n\n.form-field label,\n.form-field legend {\n  font-weight: 850;\n}\n\n.form-field input,\n.form-field textarea,\n.form-field select {\n  width: 100%;\n  min-height: 2.8rem;\n  padding: 0.68rem 0.76rem;\n  border: 1px solid var(--line);\n  border-radius: 0.65rem;\n  background: var(--page);\n  color: var(--ink);\n  font: inherit;\n}\n\n.form-field textarea {\n  resize: vertical;\n}\n\n.form-field [aria-invalid="true"] {\n  border-color: #a94c32;\n}\n\n.field-help,\n.field-error {\n  margin: 0;\n  font-size: 0.88rem;\n}\n\n.field-error {\n  color: #9b2f1b;\n  font-weight: 750;\n}\n\n.visibility-fieldset {\n  margin: 0;\n  padding: 1rem;\n  border: 1px solid var(--line);\n  border-radius: 0.8rem;\n}\n\n.visibility-fieldset label {\n  display: flex;\n  gap: 0.7rem;\n  align-items: flex-start;\n  padding-block: 0.55rem;\n  font-weight: 400;\n}\n\n.visibility-fieldset input {\n  width: auto;\n  min-height: auto;\n  margin-top: 0.3rem;\n}\n\n.form-summary:focus {\n  outline: 3px solid var(--focus);\n  outline-offset: 4px;\n}\n\n.form-summary ul {\n  margin-bottom: 0;\n}\n\n.settings-card {\n  display: grid;\n  grid-template-columns: minmax(0, 0.7fr) minmax(18rem, 1.3fr);\n  gap: 2rem;\n  padding: clamp(1.4rem, 4vw, 2.4rem);\n}\n\n.settings-card p {\n  color: var(--muted);\n}\n\n.danger-card {\n  border-color: #a94c32;\n}\n\n.delete-account-form {\n  display: grid;\n  gap: 1rem;\n}\n\n.button-danger {\n  background: #8d2d1d;\n  color: #fff;\n}\n\n.button-danger:hover {\n  background: #a63b27;\n}\n\n.button:disabled {\n  cursor: wait;\n  opacity: 0.65;\n  transform: none;\n}\n\n@media (max-width: 760px) {\n  .form-grid,\n  .settings-card {\n    grid-template-columns: 1fr;\n  }\n\n  .primary-nav {\n    gap: 0.55rem;\n    overflow-x: auto;\n    padding-block: 0.7rem;\n  }\n}\n\n@media (prefers-color-scheme: dark) {\n  .field-error {\n    color: #ffab96;\n  }\n}\n'''
          css_path.write_text(css, encoding="utf-8")

          replace_once(
              "CHANGELOG.md",
              "- Canonical `AGENTS.md` collaboration context with issue-specific handoffs and secret/staleness validation.",
              "- GitHub sign-in intent and safe error pages, public contributor directory and profiles, privacy-controlled profile editing, account settings, sign-out, and attribution-preserving deletion workflow.\n- Canonical `AGENTS.md` collaboration context with issue-specific handoffs and secret/staleness validation.",
          )

          replace_once(
              "README.md",
              "GitHub sign-in and contributor profiles are now visible as active work in [draft PR #35](../../pull/35) for [issue #5](../../issues/5).",
              "GitHub sign-in, public contributor profiles, profile editing, and account lifecycle experiences are visible as active work in [draft PR #35](../../pull/35) for [issue #5](../../issues/5).",
          )
          PY

      - name: Format the identity implementation
        run: pnpm format

      - name: Commit the normalized user interface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web tests README.md CHANGELOG.md
          git commit -m 'feat: complete the identity profile user interface'
          git push origin HEAD:feat/5-github-auth-profile
