name: Bootstrap issue 5 formatting and generated types

on:
  push:
    branches:
      - feat/5-github-auth-profile
    paths:
      - .github/workflows/bootstrap-auth-format-and-types.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-issue-5-format-and-types
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  SUPABASE_TELEMETRY_DISABLED: 1

jobs:
  normalize:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the active issue branch
        uses: actions/checkout@v7
        with:
          ref: feat/5-github-auth-profile

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format maintained source
        run: pnpm format

      - name: Start the isolated local database
        run: pnpm exec supabase db start

      - name: Rebuild and verify identity migrations
        run: |
          set -euo pipefail
          pnpm exec supabase db reset
          pnpm exec supabase test db
          pnpm exec supabase db lint --local --schema public,private --level warning --fail-on warning

      - name: Regenerate committed database types
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase gen types typescript \
            --local \
            --schema public,private \
            > packages/data/src/database.types.ts

          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/data/src/database.types.ts')
          path.write_bytes(path.read_bytes().rstrip(b'\n') + b'\n')
          PY

          pnpm format

      - name: Stop and delete the isolated database
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Commit normalized source and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-auth-format-and-types.yml
          git add apps/web packages/data pnpm-lock.yaml supabase/migrations supabase/tests
          git commit -m 'chore: normalize issue #5 source and generated types'
          git push origin HEAD:feat/5-github-auth-profile
