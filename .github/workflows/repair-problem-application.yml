name: Repair and verify Problem application

on:
  push:
    branches:
      - feat/6-problem-directory-foundation
    paths:
      - .github/workflows/repair-problem-application.yml

permissions:
  contents: write

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  repair-and-verify:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the Problem branch
        uses: actions/checkout@v7
        with:
          ref: feat/6-problem-directory-foundation

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair strict route and selected-row boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          for path in [
              "apps/web/src/app/problems/new/page.tsx",
              "apps/web/src/app/problems/[slug]/edit/page.tsx",
          ]:
              replace_once(
                  path,
                  'import type { Metadata } from "next";',
                  'import type { Metadata, Route } from "next";',
              )

          replace_once(
              "apps/web/src/app/problems/new/page.tsx",
              'redirect(createSignInPath("/problems/new", "problem"));',
              'redirect(createSignInPath("/problems/new", "problem") as Route);',
          )
          replace_once(
              "apps/web/src/app/problems/[slug]/edit/page.tsx",
              'redirect(createSignInPath(`/problems/${slug}/edit`, "problem_edit"));',
              'redirect(createSignInPath(`/problems/${slug}/edit`, "problem_edit") as Route);',
          )

          actions = Path("apps/web/src/app/problems/actions.ts")
          actions_text = actions.read_text(encoding="utf-8")
          actions_text = actions_text.replace(
              'redirect(createSignInPath(`/problems/${slug}`, "problem_signal"));',
              'redirect(createSignInPath(`/problems/${slug}`, "problem_signal") as Route);',
          )
          actions_text = actions_text.replace(
              'redirect(createSignInPath(`/problems/${slug}`, "problem_follow"));',
              'redirect(createSignInPath(`/problems/${slug}`, "problem_follow") as Route);',
          )
          actions.write_text(actions_text, encoding="utf-8")

          problems = Path("apps/web/src/lib/problems.ts")
          text = problems.read_text(encoding="utf-8")
          text = text.replace(
              'function normalizeProblemRevision(row: ProblemRevisionRow): PublicProblemRevision | null {',
              'type SelectedProblemRevisionRow = Pick<\\n  ProblemRevisionRow,\\n  "change_summary" | "created_at" | "id" | "revision_number" | "status"\\n>;\\n\\nfunction normalizeProblemRevision(\\n  row: SelectedProblemRevisionRow,\\n): PublicProblemRevision | null {',
          )
          text = text.replace(
              'const revision = normalizeProblemRevision(row as ProblemRevisionRow);',
              'const revision = normalizeProblemRevision(row);',
          )
          problems.write_text(text, encoding="utf-8")
          PY

      - name: Apply the pinned formatter
        run: pnpm format

      - name: Verify application checkpoint
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/agent-status/issue-6-application-diagnostic.txt
          status=0

          {
            echo '# Issue #6 application diagnostic'
            echo
            echo "Candidate: $(git rev-parse HEAD)"
            echo
            echo '## Type-check'
            if ! pnpm typecheck; then status=1; fi
            echo
            echo '## Unit tests'
            if ! pnpm test; then status=1; fi
            echo
            echo '## Production build'
            if ! pnpm build; then status=1; fi
          } > >(tee /tmp/problem-application-diagnostic.txt) 2>&1

          if [[ "$status" -ne 0 ]]; then
            sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/problem-application-diagnostic.txt \
              | tail -n 500 \
              > docs/agent-status/issue-6-application-diagnostic.txt
          fi

          exit "$status"

      - name: Commit verified repairs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps tests packages docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: satisfy strict Problem application boundaries'
          git push origin HEAD:feat/6-problem-directory-foundation

      - name: Commit safe failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/agent-status/issue-6-application-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agent-status/issue-6-application-diagnostic.txt
          git commit -m 'docs: record Problem application verification failure'
          git push origin HEAD:feat/6-problem-directory-foundation
