name: Bootstrap typed Problem create contract

on:
  push:
    branches:
      - feat/6-problem-directory-foundation
    paths:
      - .github/workflows/bootstrap-problem-create-rpc.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-problem-create-rpc
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
  SUPABASE_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify-and-generate:
    if: github.repository == 'samir1234khans/ManyHands'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the Problem branch
        uses: actions/checkout@v7
        with:
          ref: feat/6-problem-directory-foundation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the isolated local database
        run: pnpm exec supabase db start

      - name: Rebuild and verify every migration
        run: |
          set -euo pipefail
          pnpm exec supabase db reset
          pnpm exec supabase test db
          pnpm exec supabase db lint --local --schema public,private --level warning --fail-on warning

      - name: Generate the committed database contract
        shell: bash
        run: |
          set -euo pipefail
          generated="packages/data/src/database.types.ts"
          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            rm -f "$generated"
            echo "Generating database types (attempt ${attempt}/${max_attempts})..."

            if pnpm exec supabase gen types typescript \
              --local \
              --schema public,private \
              > "$generated"; then
              break
            fi

            rm -f "$generated"
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Database type generation failed after ${max_attempts} attempts." >&2
              exit 1
            fi

            delay=$((15 * (2 ** (attempt - 1))))
            echo "::warning::Type generation failed; retrying in ${delay}s."
            sleep "$delay"
          done

          test -s "$generated"
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/data/src/database.types.ts")
          path.write_bytes(path.read_bytes().rstrip(b"\n") + b"\n")
          PY

          grep -Fq 'create_problem' "$generated"
          test -s apps/web/src/lib/problems/form-state.ts

      - name: Normalize and run application quality gates
        run: |
          set -euo pipefail
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit the verified generated contract and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/6-problem-directory-foundation'
          patch='/tmp/problem-finalization.patch'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/bootstrap-problem-create-rpc.yml \
            .github/workflows/repair-problem-application.yml
          git add apps packages tests supabase docs .github
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'Expected generated or helper-cleanup changes were not produced.' >&2
            exit 1
          fi

          git diff --cached --binary > "$patch"
          git reset --hard
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          git apply --index "$patch"
          git diff --cached --check
          git commit -m 'fix: finalize the typed Problem create boundary'
          git push origin "HEAD:$branch"

      - name: Stop and delete the isolated database
        if: always()
        run: pnpm exec supabase stop --no-backup
