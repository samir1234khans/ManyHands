version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      application-runtime:
        patterns:
          - next
          - react
          - react-dom
      development-tooling:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope
